# Orden importa: instalar paquetes con maintenance_egress=true; cerrar el
# egreso (terraform apply -var maintenance_egress=false) ANTES de arrancar los
# servicios del honeypot (ver tag `start`).
- hosts: azure
  become: true
  roles: [common]

- hosts: strongswan
  become: true
  roles: [strongswan]

- hosts: wazuh
  become: true
  roles: [wazuh]

- hosts: logrelay
  become: true
  roles: [logrelay]

- hosts: honeyserver
  become: true
  roles: [honeypot]
