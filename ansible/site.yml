# Orden importa: instalar paquetes con maintenance_egress=true; cerrar el
# egreso (terraform apply -var maintenance_egress=false) ANTES de arrancar los
# servicios del honeypot (ver tag `start`).
- name: Base comun de las VMs del laboratorio
  hosts: azure
  become: true
  roles: [common]

- name: VM strongSwan (respondedora del tunel)
  hosts: strongswan
  become: true
  roles: [strongswan]

- name: VM Wazuh
  hosts: wazuh
  become: true
  roles: [wazuh]

- name: VM logrelay
  hosts: logrelay
  become: true
  roles: [logrelay]

- name: VM honeyserver (senuelo)
  hosts: honeyserver
  become: true
  roles: [honeypot]
