[defaults]
inventory = inventory/hosts.yml
host_key_checking = True
retry_files_enabled = False
# La llave SSH es la del operador (admin_ssh_public_key_path de terraform/lab).
# private_key_file se define fuera del repo: export ANSIBLE_PRIVATE_KEY_FILE=...

[ssh_connection]
pipelining = True
# MaxAuthTries 3 + agente SSH con varias llaves: sin IdentitiesOnly, ssh ofrece
# primero las llaves del agente y agota los intentos antes de probar la de
# private_key_file; el servidor corta con "Too many authentication failures".
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
