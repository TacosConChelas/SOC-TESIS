# Configuracion del ensayo local. Las rutas absolutas (inventario, llave y
# known_hosts) las exporta el Makefile con ANSIBLE_*; aqui solo el
# comportamiento comun.
[defaults]
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# MaxAuthTries 3 + agente SSH con varias llaves: IdentitiesOnly evita que ssh
# ofrezca las llaves del agente y agote los intentos antes de la de
# ANSIBLE_PRIVATE_KEY_FILE.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
