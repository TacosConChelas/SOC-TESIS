# Se ejecuta desde un host del lab (192.168.1.73) CON EL TÚNEL ARRIBA.
# Sin túnel no hay ruta a 10.50.x (nsg-* no tienen SSH desde Internet).
all:
  vars:
    ansible_user: soctesis
  children:
    azure:
      hosts:
        strongswan: { ansible_host: 10.50.20.10 }
        wazuh:      { ansible_host: 10.50.40.10 }
        logrelay:   { ansible_host: 10.50.30.10 }
        honeyserver:
          ansible_host: 10.50.10.10
          ansible_port: 22222   # el 22 público es el señuelo del honeypot
