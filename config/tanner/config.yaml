# Copia COMPLETA del config.yaml horneado en dtagdevsec/tanner:24.04.1@sha256:eb971d...
# (extraído verbatim de la imagen: `docker run --entrypoint cat ... /opt/tanner/data/config.yaml`,
# evidencia: evidence/local-tests/2026-10-13-diagnostico-dionaea-tanner/B5-config.py-source.txt
# confirma que config.py carga exactamente esta ruta como DEFAULT_CONFIG en import-time).
#
# ÚNICO cambio respecto al original: TANNER.host: tanner -> 0.0.0.0 (línea 11).
#
# CAUSA RAÍZ (confirmada empíricamente, E3, 2026-10-13): server.py:TannerServer.start()
# llama `web.run_app(self.make_app(), host=TannerConfig.get("TANNER","host"), port=8090)`.
# Con host="tanner" (el hostname del propio contenedor, no una IP), aiohttp/asyncio
# nunca completaba el bind: el proceso quedaba vivo (PID 1 corriendo) pero sin
# escuchar en 8090 indefinidamente (10+ min probado), sin ningún error ni log
# adicional. Con host="0.0.0.0" el bind es inmediato y verificado con una
# petición HTTP real (`GET /version` -> 200, ver B6-config-override/01-run.txt).
# No se identificó un bug en redis_client.py/dorks_manager.py (aioredis.from_url
# es perezoso, no bloquea; la ausencia de user_dorks.pickle está protegida por
# `os.path.exists()` en dorks_manager.py — no es la causa, pese a ser una
# hipótesis razonable inicial).
DATA:
  db_config: /opt/tanner/db/db_config.json
  dorks: /opt/tanner/data/dorks.pickle
  user_dorks: /opt/tanner/data/user_dorks.pickle
  crawler_stats: /opt/tanner/data/crawler_user_agents.txt
  geo_db: /opt/tanner/db/GeoLite2-City.mmdb
  tornado: /opt/tanner/data/tornado.py
  mako: /opt/tanner/data/mako.py

TANNER:
  host: 0.0.0.0
  port: 8090

WEB:
  host: tanner_web
  port: 8091

API:
  host: tanner_api
  port: 8092
  auth: False
  auth_signature: tanner_api_auth

PHPOX:
  host: tanner_phpox
  port: 8088

REDIS:
  host: tanner_redis
  port: 6379
  poolsize: 80
  timeout: 1

EMULATORS:
  root_dir: /opt/tanner

EMULATOR_ENABLED:
  sqli: True
  rfi: True
  lfi: False
  xss: True
  cmd_exec: False
  php_code_injection: True
  php_object_injection: True
  crlf: True
  xxe_injection: True
  template_injection: False

SQLI:
  type: SQLITE
  db_name: tanner_db
  host: localhost
  user: root
  password: user_pass

XXE_INJECTION:
  OUT_OF_BAND: False

RFI:
  allow_insecure: True

DOCKER:
  host_image: busybox:latest

LOGGER:
  log_debug: /tmp/tanner/tanner.log
  log_err: /tmp/tanner/tanner.err

MONGO:
  enabled: False
  URI: mongodb://localhost

HPFEEDS:
  enabled: False
  HOST: localhost
  PORT: 10000
  IDENT: ''
  SECRET: ''
  CHANNEL: tanner.events

LOCALLOG:
  enabled: True
  PATH: /var/log/tanner/tanner_report.json

CLEANLOG:
  enabled: False

REMOTE_DOCKERFILE:
  GITHUB: "https://raw.githubusercontent.com/mushorg/tanner/master/docker/tanner/template_injection/Dockerfile"

SESSIONS:
  delete_timeout: 300
