# Fuente: https://dionaea.readthedocs.io/en/latest/configuration.html (dionaea.cfg
# oficial por defecto, CC0-1.0). Montado como archivo único (no como directorio)
# porque el bind de services-enabled/ihandlers-enabled hace que Docker cree
# /opt/dionaea/etc/dionaea como directorio ANTES de que arranque el entrypoint
# de la imagen; su lógica `test ! -d .../etc/dionaea && init_etc` entonces se
# salta y dionaea.cfg nunca se copia desde la plantilla (E3, 2026-10-13: exit
# 133 en bucle sin ningún log, doc 20 §9). Mantener este archivo como copia
# fiel del default oficial evita reinventar su estructura.
#
# CORRECCIÓN (E3, 2026-10-13, segunda ronda — investigación de estabilidad):
# la copia inicial de este archivo (tomada literalmente de la página de docs)
# conservaba los placeholders de build @DIONAEA_STATEDIR@/@DIONAEA_LOGDIR@/
# @DIONAEA_CONFDIR@ sin resolver. Se confirmó por extracción directa del
# dionaea.cfg REALMENTE horneado en la imagen (docker exec cat, ver
# evidence/local-tests/2026-10-13-dionaea-stability-decision/D1-isolate-
# variable/baked-dionaea.cfg) que esos placeholders se sustituyen en tiempo
# de BUILD/empaquetado del proyecto (nunca en runtime); al montar el archivo
# tal cual, Dionaea los trataba como texto literal (p. ej.
# download.dir=@DIONAEA_STATEDIR@/binaries/, una ruta inválida). También
# faltaba la línea `processors=filter_streamdumper,filter_emu` (presente en
# el horneado real, ausente en el ejemplo de la web). Un experimento de una
# sola variable (D1-isolate-variable/01-run.txt, TEST E vs TEST G) demostró
# que esto —no un fallo no determinista en el binario— era la causa del
# SIGSEGV (`main+0xb85`, idéntico en nightly y en el tag estable 0.11.0,
# ver A5-addr2line-resolution.txt): con los placeholders resueltos a rutas
# literales (var/lib/dionaea, var/log/dionaea, etc/dionaea, las mismas que
# usa el dionaea.cfg horneado) y `processors=` restaurado, 3/3 corridas
# sobrevivieron >30 s sin crash. Mismo macro sin resolver existía en
# http.yaml/ftp.yaml/sip.yaml/tftp.yaml/log_json.yaml — corregido ahí también.
#
# ÚNICO cambio INTENCIONAL respecto al default oficial (ya resuelto): ssl.default.cn
# (D3/18_DECISIONES_IMPLEMENTACION.md §1 — "valores genéricos que no identifiquen
# el proyecto"). modules=curl,python,emu YA excluye nfq (D-H22) y pcap en el
# default oficial: sin cambios ahí.

[dionaea]
download.dir=var/lib/dionaea/binaries/
#modules=curl,python,nfq,emu,pcap
modules=curl,python,emu
processors=filter_streamdumper,filter_emu

listen.mode=getifaddrs
# listen.addresses=127.0.0.1
# listen.interfaces=eth0,tap0

# listen.use_ipv4_mapped_ipv6=false

# D3: certificado HTTPS con valores genéricos, no identificables con el
# proyecto (se deja el resto del bloque SSL comentado = defaults de dionaea).
ssl.default.cn=localhost
# ssl.default.c=
# ssl.default.o=
# ssl.default.ou=

# ssl.default.cert=etc/dionaea/ssl/your-certificate-with-chain.crt
# ssl.default.key=etc/dionaea/ssl/your-private-key.key

[logging]
default.filename=var/log/dionaea/dionaea.log
default.levels=all
default.domains=*

errors.filename=var/log/dionaea/dionaea-errors.log
errors.levels=warning,error
errors.domains=*

[processor.filter_emu]
name=filter
config.allow.0.protocols=smbd,epmapper,nfqmirrord,mssqld
next=emu

[processor.filter_streamdumper]
name=filter
config.allow.0.types=accept
config.allow.1.types=connect
config.allow.1.protocols=ftpctrl
config.deny.0.protocols=ftpdata,ftpdatacon,xmppclient
next=streamdumper

[processor.streamdumper]
name=streamdumper
config.path=var/lib/dionaea/bistreams/%Y-%m-%d/

[processor.emu]
name=emu
config.limits.files=3
config.limits.filesize=524288
config.limits.sockets=3
config.limits.sustain=120
config.limits.idle=30
config.limits.listen=30
config.limits.cpu=120
config.limits.steps=1073741824

[module.nfq]
queue=2

[module.nl]
lookup_ethernet_addr=no

[module.python]
imports=dionaea.log,dionaea.services,dionaea.ihandlers
sys_paths=default
service_configs=etc/dionaea/services-enabled/*.yaml
ihandler_configs=etc/dionaea/ihandlers-enabled/*.yaml

[module.pcap]
any.interface=any
